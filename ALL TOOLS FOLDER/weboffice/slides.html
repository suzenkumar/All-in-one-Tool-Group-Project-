<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slides — Presentation Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --app:#c5221f; --app-500:#EA4335; --app-100:#fce8e6; --app-900:#a50e0e;
    --ink:#202124; --ink-soft:#5f6368; --line:#e0dde0; --chrome:#ffffff; --bar:#f8f9fa;
    --canvas:#eee9e8; --thumbs-bg:#f7f3f3; --notes-bg:#ffffff; --shadow-lg:0 2px 6px rgba(60,64,67,.25), 0 8px 20px 4px rgba(60,64,67,.16);
  }
  body.dark{
    --ink:#e8eaed; --ink-soft:#9aa0a6; --line:#3c4043; --chrome:#202124; --bar:#292a2d;
    --canvas:#1b1c1f; --thumbs-bg:#25262a; --notes-bg:#292a2d; --app-100:#2f2323;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    color:var(--ink); height:100vh; display:flex; flex-direction:column; background:var(--chrome);
    transition:background .25s, color .25s; overflow:hidden;
  }

  .titlebar{
    background:var(--chrome); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:8px 16px; flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0; }
  .logo{
    width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
    color:#fff; font-size:19px; font-weight:700;
    background:linear-gradient(135deg, #EA4335, #c5221f);
    box-shadow:0 2px 6px rgba(197,34,31,.35);
  }
  .brand-name{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-name b{ font-size:13px; letter-spacing:.02em; }
  .brand-name span{ font-size:11px; color:var(--ink-soft); }
  .titlebar input.docname{
    flex:1; min-width:80px; max-width:340px; text-align:center; margin:0 auto;
    background:transparent; border:none; color:var(--ink); font-size:17px; font-weight:500;
    outline:none; border-radius:8px; padding:7px 12px; font-family:inherit; transition:background .2s;
  }
  .titlebar input.docname:hover{ background:var(--bar); }
  .titlebar input.docname:focus{ background:var(--bar); box-shadow:0 0 0 2px var(--app-500) inset; }
  .titlebar .actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .tb-btn{
    display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:500; color:var(--ink); background:transparent; border-radius:8px;
    padding:8px 11px; white-space:nowrap; transition:background .15s, box-shadow .15s;
  }
  .tb-btn:hover{ background:var(--bar); }
  .tb-btn.icon-only{ width:38px; height:38px; justify-content:center; padding:0; font-size:16px; }
  .tb-btn.primary{ background:var(--app); color:#fff; box-shadow:0 1px 2px rgba(197,34,31,.4); }
  .tb-btn.primary:hover{ background:var(--app-900); }
  .autosave{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-soft); margin:0 4px; }
  .autosave-dot{ width:8px; height:8px; border-radius:50%; background:#34A853; transition:background .3s; }
  .autosave-dot.saving{ background:#FBBC04; }

  .ribbon{
    background:var(--bar); border-bottom:1px solid var(--line); display:flex; align-items:center;
    gap:2px; padding:6px 12px; flex-wrap:wrap; flex-shrink:0;
  }
  .grp{ display:flex; align-items:center; gap:3px; padding:2px 10px; border-right:1px solid var(--line); }
  .grp:first-child{ padding-left:2px; }
  .grp:last-child{ border-right:none; }
  select, .ribbon button{
    background:var(--chrome); border:1px solid transparent; border-radius:8px; cursor:pointer;
    font-family:inherit; font-size:13px; color:var(--ink); padding:6px 9px; height:32px;
    transition:background .15s, border-color .15s, box-shadow .15s;
  }
  select:hover, .ribbon button:hover{ background:var(--canvas); border-color:var(--line); }
  select:focus-visible, .ribbon button:focus-visible{ outline:none; box-shadow:0 0 0 2px var(--app-500); }
  .ribbon button.iconbtn{ width:34px; padding:0; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
  .ribbon button.active{ background:var(--app-100); color:var(--app); border-color:rgba(197,34,31,.3); }
  .colorwrap{ position:relative; width:34px; height:32px; border-radius:8px; background:var(--chrome); }
  .colorwrap input[type=color]{ position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .colorwrap .swatch{
    width:34px; height:32px; border-radius:8px; border:1px solid transparent; background:var(--chrome);
    display:flex; align-items:center; justify-content:center; font-weight:700; pointer-events:none; font-size:13px;
  }
  .colorwrap:hover .swatch{ background:var(--canvas); border-color:var(--line); }
  .colorwrap .bar{ height:4px; margin-top:-6px; border-radius:2px; }

  .main{ flex:1; display:flex; overflow:hidden; }
  .thumbs{
    width:180px; background:var(--thumbs-bg); border-right:1px solid var(--line);
    overflow-y:auto; padding:14px 12px; flex-shrink:0;
  }
  .thumb{
    width:100%; aspect-ratio:16/9; background:#fff; border:2px solid var(--line); border-radius:8px;
    margin-bottom:12px; cursor:grab; position:relative; overflow:hidden;
    box-shadow:0 1px 3px rgba(60,64,67,.2); transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .thumb:hover{ transform:translateY(-1px); }
  .thumb.active{ border-color:var(--app-500); box-shadow:0 0 0 2px rgba(234,67,53,.25); }
  .thumb.dragover{ border-color:#333; border-style:dashed; }
  .thumb .num{ position:absolute; top:3px; left:5px; font-size:10px; color:#9aa0a6; z-index:2; font-weight:600; }
  .thumb-preview{ position:absolute; inset:0; padding:4px; font-size:5px; overflow:hidden; pointer-events:none; }
  .thumb-actions{ position:absolute; bottom:3px; right:3px; display:flex; gap:2px; z-index:2; }
  .thumb-actions button{
    width:20px; height:20px; font-size:11px; line-height:1; border:none; border-radius:5px;
    background:rgba(255,255,255,.92); color:#5f6368; cursor:pointer; padding:0; box-shadow:0 1px 3px rgba(60,64,67,.3);
  }
  .thumb-actions button:hover{ background:var(--app-100); color:var(--app); }
  .addSlideBtn{
    width:100%; padding:10px; border:1.5px dashed var(--app-500); background:var(--chrome); color:var(--app);
    border-radius:10px; cursor:pointer; font-size:13px; margin-top:6px; font-family:inherit; font-weight:600;
    transition:background .15s, box-shadow .15s;
  }
  .addSlideBtn:hover{ background:var(--app-100); box-shadow:0 2px 6px rgba(197,34,31,.15); }

  .center-col{ flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .canvas-area{
    flex:1; display:flex; align-items:center; justify-content:center; background:var(--canvas);
    overflow:auto; padding:28px;
  }
  #canvasScale{
    position:relative; width:960px; height:540px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  #slideCanvas{
    width:960px; height:540px; transform-origin:center;
    background:#ffffff; position:relative; box-shadow:var(--shadow-lg);
    overflow:hidden; flex-shrink:0; border-radius:2px;
  }
  .el{ position:absolute; cursor:move; border:1px solid transparent; padding:2px; }
  .el.selected{ border:1px solid var(--app-500); box-shadow:0 0 0 1px rgba(234,67,53,.2); }
  .el .content{ width:100%; height:100%; outline:none; overflow:hidden; word-wrap:break-word; }
  .el img{ width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .el .shapebox{ width:100%; height:100%; pointer-events:none; }
  .resize-handle{
    position:absolute; width:13px; height:13px; background:var(--app-500); right:-7px; bottom:-7px;
    cursor:nwse-resize; border-radius:3px; display:none; box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .el.selected .resize-handle{ display:block; }

  .notes-bar{
    border-top:1px solid var(--line); background:var(--notes-bg); padding:9px 18px; flex-shrink:0;
  }
  .notes-bar label{ font-size:11px; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .notes-bar textarea{
    width:100%; height:46px; resize:vertical; border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; font-size:12.5px; font-family:inherit; background:var(--bar); color:var(--ink);
    outline:none; transition:box-shadow .15s;
  }
  .notes-bar textarea:focus{ box-shadow:0 0 0 2px var(--app-500); border-color:transparent; }

  /* Present mode */
  #presentOverlay{
    position:fixed; inset:0; background:#111; z-index:1000; display:none; align-items:center; justify-content:center;
  }
  #presentSlide{ width:100%; max-width:1280px; aspect-ratio:16/9; position:relative; background:#fff; box-shadow:0 0 80px rgba(0,0,0,.6); }
  #presentHint{
    position:absolute; bottom:16px; right:24px; color:rgba(255,255,255,.55); font-size:12.5px;
    font-family:'Inter',sans-serif; letter-spacing:.02em;
  }
  #presentCounter{
    position:absolute; bottom:16px; left:24px; color:rgba(255,255,255,.55); font-size:12.5px;
    font-family:'Inter',sans-serif;
  }

  .banner{
    position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:20;
    background:var(--app); color:#fff; padding:9px 16px; border-radius:10px; font-size:13px;
    display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-lg);
  }
  .banner button{
    background:rgba(255,255,255,.2); border:none; color:#fff; padding:5px 11px; border-radius:7px;
    font-size:12px; cursor:pointer; font-family:inherit; font-weight:500;
  }
  .banner button:hover{ background:rgba(255,255,255,.3); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(32,33,36,.5); display:none; align-items:center;
    justify-content:center; z-index:100; backdrop-filter:blur(3px);
  }
  .modal{
    background:var(--chrome); color:var(--ink); border-radius:14px; padding:22px; width:380px; max-width:92vw;
    box-shadow:var(--shadow-lg); max-height:82vh; overflow:auto; border:1px solid var(--line);
  }
  .modal h3{ margin:0 0 6px; font-size:16px; font-weight:600; }
  .modal .hint{ font-size:11px; color:var(--ink-soft); margin:-4px 0 10px; }
  .modal .row{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .modal button{
    padding:8px 15px; border-radius:8px; border:1px solid var(--line); background:var(--chrome);
    color:var(--ink); cursor:pointer; font-size:13px; font-family:inherit; font-weight:500; transition:background .15s;
  }
  .modal button:hover{ background:var(--bar); }
  .modal button.primary{ background:var(--app); color:#fff; border-color:var(--app); }
  .modal button.primary:hover{ background:var(--app-900); }
  .version-item, .template-item{
    display:flex; align-items:center; justify-content:space-between; padding:10px 6px;
    border-bottom:1px solid var(--line); font-size:13px; gap:8px; border-radius:8px;
  }
  .version-item:hover, .template-item:hover{ background:var(--bar); }
  .version-item .meta{ color:var(--ink-soft); font-size:11px; }
  .template-item{ cursor:pointer; }
  .small-btn{ padding:5px 11px !important; font-size:11px !important; }

  /* ---------- responsive ---------- */
  @media (max-width:1100px){
    .ribbon{ flex-wrap:nowrap; overflow-x:auto; padding:6px 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .ribbon::-webkit-scrollbar{ display:none; }
    .ribbon .grp{ flex:0 0 auto; }
  }
  @media (max-width:900px){
    body{ height:100dvh; }
    .main{ flex-direction:column; min-height:0; }
    .thumbs{
      width:100%; height:auto; flex-direction:row; display:flex; gap:10px;
      overflow-x:auto; overflow-y:hidden; padding:10px 12px; flex-shrink:0;
      border-right:none; border-bottom:1px solid var(--line);
      scrollbar-width:none; -webkit-overflow-scrolling:touch;
    }
    .thumbs::-webkit-scrollbar{ display:none; }
    .thumb{ width:132px; flex:0 0 auto; margin-bottom:0; }
    .thumb .num{ font-size:9px; }
    .addSlideBtn{ width:auto; flex:0 0 auto; padding:0 16px; margin-top:0; align-self:center; }
    .center-col{ min-width:0; }
    .canvas-area{ flex:1 1 auto; min-height:0; padding:12px; }
    .notes-bar{ flex-shrink:0; }
    #presentSlide{ width:960px; height:540px; max-width:none; transform-origin:center; }
  }
  @media (max-width:860px){
    .titlebar{ flex-wrap:wrap; padding:8px 10px; }
    .titlebar .actions{ width:100%; justify-content:flex-end; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .titlebar .actions::-webkit-scrollbar{ display:none; }
    .autosave span:last-child{ display:none; }
  }
  @media (max-width:640px){
    .brand-name span{ display:none; }
    .titlebar input.docname{ font-size:14px; padding:6px 8px; min-width:60px; }
    .tb-btn{ padding:8px 9px; font-size:12px; }
    .thumb{ width:116px; }
    .canvas-area{ padding:8px; }
    .notes-bar{ padding:8px 12px; }
    .notes-bar textarea{ height:38px; }
  }
  @media (max-width:480px){
    .brand-name{ display:none; }
    .titlebar .actions{ gap:3px; }
    .tb-btn{ padding:7px 8px; font-size:11.5px; }
    .tb-btn.primary{ padding:7px 10px; }
    .thumb{ width:104px; }
  }
</style>
</head>
<body>

<div class="titlebar">
  <a class="brand" href="index.html">
    <div class="logo">P</div>
    <div class="brand-name"><b>WebOffice</b><span>Slides</span></div>
  </a>
  <input class="docname" id="docName" value="Untitled presentation">
  <div class="actions">
    <span class="autosave"><span class="autosave-dot" id="autosaveDot"></span><span id="autosaveLabel">Saved</span></span>
    <button class="tb-btn" onclick="importFile()">⬆ Import</button>
    <input type="file" id="fileInput" accept=".pptx" style="display:none">
    <button class="tb-btn icon-only" onclick="toggleTheme()" id="themeBtn" title="Toggle dark mode">🌙</button>
    <button class="tb-btn" onclick="openTemplates()">Templates</button>
    <button class="tb-btn" onclick="openVersions()">History</button>
    <button class="tb-btn" onclick="startPresent()">▶ Present</button>
    <button class="tb-btn primary" onclick="exportPptx()">⬇ Download .pptx</button>
  </div>
</div>

<div class="ribbon">
  <div class="grp">
    <button onclick="addTextBox()">+ Text box</button>
    <button onclick="addImage()">+ Image</button>
    <button onclick="addShape('rect')">▭ Rectangle</button>
    <button onclick="addShape('ellipse')">⬭ Circle</button>
  </div>
  <div class="grp">
    <select id="fontSize" onchange="applyFontSize(this.value)" title="Size">
      <option>14</option><option>18</option><option selected>24</option><option>32</option><option>40</option><option>54</option><option>72</option>
    </select>
    <button class="iconbtn" id="b-bold" onclick="toggleTextStyle('bold')"><b>B</b></button>
    <button class="iconbtn" id="b-italic" onclick="toggleTextStyle('italic')"><i>I</i></button>
    <div class="colorwrap" title="Text color">
      <div class="swatch">A<div class="bar" id="textColorBar" style="background:#202124"></div></div>
      <input type="color" id="textColor" value="#202124" oninput="applyTextColor(this.value)">
    </div>
  </div>
  <div class="grp">
    <button class="iconbtn" title="Align left" onclick="applyAlign('left')">⯇</button>
    <button class="iconbtn" title="Align center" onclick="applyAlign('center')">☰</button>
    <button class="iconbtn" title="Align right" onclick="applyAlign('right')">⯈</button>
  </div>
  <div class="grp">
    <div class="colorwrap" title="Shape fill">
      <div class="swatch">🎨<div class="bar" id="shapeColorBar" style="background:#c5221f"></div></div>
      <input type="color" id="shapeColor" value="#c5221f" oninput="applyShapeColor(this.value)">
    </div>
    <div class="colorwrap" title="Slide background">
      <div class="swatch">🖼<div class="bar" id="bgColorBar" style="background:#ffffff"></div></div>
      <input type="color" id="bgColor" value="#ffffff" oninput="applyBgColor(this.value)">
    </div>
  </div>
  <div class="grp">
    <button onclick="duplicateSlide()">⧉ Duplicate slide</button>
    <button onclick="deleteElement()">🗑 Delete</button>
  </div>
</div>

<div class="main">
  <div class="thumbs" id="thumbs"></div>
  <div class="center-col">
    <div class="canvas-area" style="position:relative;">
      <div id="restoreBanner" class="banner" style="display:none;">
        <span>A previous autosaved deck was found.</span>
        <button onclick="restoreAutosave()">Restore</button>
        <button onclick="dismissAutosave()">Discard</button>
      </div>
      <div id="canvasScale"><div id="slideCanvas"></div></div>
    </div>
    <div class="notes-bar">
      <label>Speaker notes</label>
      <textarea id="notesInput" placeholder="Notes for this slide (visible when presenting, included in the exported file)..."></textarea>
    </div>
  </div>
</div>

<div id="presentOverlay">
  <div id="presentSlide"></div>
  <div id="presentCounter"></div>
  <div id="presentHint">← → space to navigate · Esc to exit</div>
</div>

<div class="modal-backdrop" id="versionModal">
  <div class="modal">
    <h3>Version History</h3>
    <div class="hint">Snapshots are saved on this device only.</div>
    <div class="row" style="justify-content:flex-start; margin-bottom:12px;">
      <button class="primary" onclick="saveVersion()">💾 Save current as version</button>
    </div>
    <div id="versionList"></div>
    <div class="row" style="margin-top:14px;">
      <button onclick="closeVersions()">Close</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="templateModal">
  <div class="modal">
    <h3>Start from a template</h3>
    <div class="hint">This replaces your current presentation.</div>
    <div id="templateList"></div>
    <div class="row" style="margin-top:14px;">
      <button onclick="closeTemplates()">Cancel</button>
    </div>
  </div>
</div>

<script>
let slides = [ makeSlide() ];
let currentSlide = 0;
let selectedEl = null;

function makeSlide(){
  return { bg:'#ffffff', notes:'', elements:[
    { id:uid(), type:'text', x:8, y:8, w:84, h:16, text:'Click to add title', fontSize:40, bold:true, italic:false, color:'#202124', align:'left' },
    { id:uid(), type:'text', x:8, y:30, w:84, h:50, text:'Click to add subtitle or content', fontSize:22, bold:false, italic:false, color:'#5f6368', align:'left' },
  ]};
}
function uid(){ return 'e' + Math.random().toString(36).slice(2,9); }

const canvas = document.getElementById('slideCanvas');
const thumbsEl = document.getElementById('thumbs');
const notesInput = document.getElementById('notesInput');

function renderAll(){ renderThumbs(); renderCanvas(); notesInput.value = slides[currentSlide].notes || ''; }

function renderThumbs(){
  thumbsEl.innerHTML = '';
  slides.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'thumb' + (i===currentSlide ? ' active':'');
    div.style.background = s.bg;
    div.draggable = true;
    div.dataset.idx = i;
    div.onclick = ()=>{ currentSlide=i; selectedEl=null; renderAll(); };
    div.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', i); });
    div.addEventListener('dragover', e=>{ e.preventDefault(); div.classList.add('dragover'); });
    div.addEventListener('dragleave', ()=> div.classList.remove('dragover'));
    div.addEventListener('drop', e=>{
      e.preventDefault(); div.classList.remove('dragover');
      const from = parseInt(e.dataTransfer.getData('text/plain'));
      const to = i;
      if(from===to) return;
      const [moved] = slides.splice(from,1);
      slides.splice(to,0,moved);
      currentSlide = to;
      renderAll();
    });

    const num = document.createElement('div'); num.className='num'; num.textContent = i+1;
    div.appendChild(num);
    const prev = document.createElement('div'); prev.className='thumb-preview';
    s.elements.forEach(el=>{
      const p = document.createElement('div');
      p.style.position='absolute';
      p.style.left=el.x+'%'; p.style.top=el.y+'%'; p.style.width=el.w+'%'; p.style.height=el.h+'%';
      if(el.type==='text'){
        p.style.fontSize = (el.fontSize/6)+'px';
        p.style.fontWeight = el.bold?'700':'400';
        p.style.color = el.color;
        p.style.overflow='hidden';
        p.textContent = el.text;
      } else if(el.type==='image'){
        p.style.background = '#ccc';
      } else if(el.type==='shape'){
        p.style.background = el.color;
        if(el.shapeType==='ellipse') p.style.borderRadius='50%';
      }
      prev.appendChild(p);
    });
    div.appendChild(prev);

    const actions = document.createElement('div'); actions.className='thumb-actions';
    const delBtn = document.createElement('button'); delBtn.textContent='✕'; delBtn.title='Delete slide';
    delBtn.onclick = (e)=>{ e.stopPropagation(); if(slides.length>1){ slides.splice(i,1); currentSlide=Math.max(0,Math.min(currentSlide,slides.length-1)); renderAll(); } };
    actions.appendChild(delBtn);
    div.appendChild(actions);

    thumbsEl.appendChild(div);
  });
  const addBtn = document.createElement('button');
  addBtn.className='addSlideBtn'; addBtn.textContent='+ New slide';
  addBtn.onclick = ()=>{ slides.splice(currentSlide+1,0,makeSlide()); currentSlide++; renderAll(); };
  thumbsEl.appendChild(addBtn);
  scheduleAutosave();
}

function renderCanvas(){
  const s = slides[currentSlide];
  canvas.style.background = s.bg;
  canvas.innerHTML = '';
  s.elements.forEach(el=>{
    const div = document.createElement('div');
    div.className = 'el' + (selectedEl===el.id ? ' selected':'');
    div.style.left = el.x+'%'; div.style.top = el.y+'%'; div.style.width = el.w+'%'; div.style.height = el.h+'%';
    div.dataset.id = el.id;

    if(el.type==='text'){
      const content = document.createElement('div');
      content.className='content';
      content.contentEditable = true;
      content.style.fontSize = el.fontSize+'px';
      content.style.fontWeight = el.bold ? '700':'400';
      content.style.fontStyle = el.italic ? 'italic':'normal';
      content.style.color = el.color;
      content.style.textAlign = el.align;
      content.style.fontFamily = "'Inter', 'Segoe UI', Arial, sans-serif";
      content.innerText = el.text;
      content.addEventListener('input', ()=>{ el.text = content.innerText; renderThumbs(); });
      content.addEventListener('mousedown', e=> e.stopPropagation());
      div.appendChild(content);
    } else if(el.type==='image'){
      const img = document.createElement('img');
      img.src = el.src;
      div.appendChild(img);
    } else if(el.type==='shape'){
      const box = document.createElement('div');
      box.className = 'shapebox';
      box.style.background = el.color;
      if(el.shapeType==='ellipse') box.style.borderRadius='50%';
      div.appendChild(box);
    }

    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    div.appendChild(handle);

    div.addEventListener('mousedown', e=>{
      selectedEl = el.id;
      renderCanvas();
      syncToolbar(el);
      if(e.target === handle) startResize(e, el, div);
      else startDrag(e, el, div);
    });

    canvas.appendChild(div);
  });
  scheduleAutosave();
}

function startDrag(e, el, div){
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  const origX = el.x, origY = el.y;
  function onMove(ev){
    const dx = (ev.clientX - startX)/rect.width*100;
    const dy = (ev.clientY - startY)/rect.height*100;
    el.x = Math.max(0, Math.min(100-el.w, origX+dx));
    el.y = Math.max(0, Math.min(100-el.h, origY+dy));
    div.style.left = el.x+'%'; div.style.top = el.y+'%';
  }
  function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); renderThumbs(); }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}
function startResize(e, el, div){
  e.preventDefault(); e.stopPropagation();
  const rect = canvas.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  const origW = el.w, origH = el.h;
  function onMove(ev){
    const dx = (ev.clientX - startX)/rect.width*100;
    const dy = (ev.clientY - startY)/rect.height*100;
    el.w = Math.max(4, Math.min(100-el.x, origW+dx));
    el.h = Math.max(4, Math.min(100-el.y, origH+dy));
    div.style.width = el.w+'%'; div.style.height = el.h+'%';
  }
  function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); renderThumbs(); }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

canvas.addEventListener('mousedown', e=>{ if(e.target === canvas){ selectedEl = null; renderCanvas(); } });

function syncToolbar(el){

}

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', e=>{
  const typing = document.activeElement && (document.activeElement.isContentEditable || document.activeElement.tagName==='INPUT' || document.activeElement.tagName==='TEXTAREA');
  if(presentActive){
    if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); presentNext(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); presentPrev(); }
    else if(e.key==='Escape'){ exitPresent(); }
    return;
  }
  if(typing) return;
  if((e.key==='Delete' || e.key==='Backspace') && selectedEl){ e.preventDefault(); deleteElement(); }
  else if(e.key.startsWith('Arrow') && selectedEl){
    e.preventDefault();
    const el = getSelected(); if(!el) return;
    const step = e.shiftKey ? 5 : 1;
    if(e.key==='ArrowLeft') el.x = Math.max(0, el.x-step);
    if(e.key==='ArrowRight') el.x = Math.min(100-el.w, el.x+step);
    if(e.key==='ArrowUp') el.y = Math.max(0, el.y-step);
    if(e.key==='ArrowDown') el.y = Math.min(100-el.h, el.y+step);
    renderCanvas();
  }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d' && selectedEl){
    e.preventDefault();
    const el = getSelected();
    const copy = {...el, id:uid(), x:Math.min(100-el.w, el.x+3), y:Math.min(100-el.h, el.y+3)};
    slides[currentSlide].elements.push(copy);
    selectedEl = copy.id;
    renderAll();
  }
});

renderAll();

// ---- Responsive canvas scaling ----
function fitCanvas(){
  const wrap = document.getElementById('canvasScale');
  if(!wrap) return;
  const area = document.querySelector('.canvas-area');
  let aw = innerWidth, ah = innerHeight;
  if(area){
    const cs = getComputedStyle(area);
    aw = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    ah = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  }
  const fit = Math.max(0.1, Math.min(1, aw/960, ah/540));
  wrap.style.width = (960*fit)+'px';
  wrap.style.height = (540*fit)+'px';
  canvas.style.transform = fit<1 ? 'scale('+fit+')' : '';
}
function fitPresent(){
  const ps = document.getElementById('presentSlide');
  if(!ps) return;
  const fit = Math.max(0.1, Math.min(1, innerWidth/960, innerHeight/540));
  ps.style.transform = fit<1 ? 'scale('+fit+')' : '';
}
fitCanvas();
addEventListener('resize', ()=>{ fitCanvas(); if(presentActive) fitPresent(); });

// ---- Present mode ----
let presentActive = false;
function startPresent(){
  presentActive = true;
  document.getElementById('presentOverlay').style.display = 'flex';
  renderPresentSlide();
  fitPresent();
}
function exitPresent(){
  presentActive = false;
  document.getElementById('presentOverlay').style.display = 'none';
}
function presentNext(){ if(currentSlide < slides.length-1){ currentSlide++; renderPresentSlide(); renderThumbs(); } }
function presentPrev(){ if(currentSlide > 0){ currentSlide--; renderPresentSlide(); renderThumbs(); } }
function renderPresentSlide(){
  const s = slides[currentSlide];
  const holder = document.getElementById('presentSlide');
  holder.style.background = s.bg;
  holder.innerHTML = '';
  s.elements.forEach(el=>{
    const div = document.createElement('div');
    div.style.position='absolute';
    div.style.left=el.x+'%'; div.style.top=el.y+'%'; div.style.width=el.w+'%'; div.style.height=el.h+'%';
    if(el.type==='text'){
      div.style.fontSize = el.fontSize+'px';
      div.style.fontWeight = el.bold?'700':'400';
      div.style.fontStyle = el.italic?'italic':'normal';
      div.style.color = el.color;
      div.style.textAlign = el.align;
      div.style.fontFamily = "'Inter', 'Segoe UI', Arial, sans-serif";
      div.style.overflow='hidden';
      div.textContent = el.text;
    } else if(el.type==='image'){
      const img = document.createElement('img');
      img.src = el.src; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='contain';
      div.appendChild(img);
    } else if(el.type==='shape'){
      div.style.background = el.color;
      if(el.shapeType==='ellipse') div.style.borderRadius='50%';
    }
    holder.appendChild(div);
  });
  document.getElementById('presentCounter').textContent = (currentSlide+1) + ' / ' + slides.length;
}
document.getElementById('presentOverlay').addEventListener('click', e=>{

});

// ---- Import (.pptx) ----
function importFile(){
  const inp = document.getElementById('fileInput');
  inp.onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      if(typeof JSZip === 'undefined'){ alert('Import library is not loaded — check your internet connection.'); return; }
      const zip = await JSZip.loadAsync(file);
      const imported = await parsePptx(zip);
      if(!imported || !imported.length) throw new Error('No slides found in this file.');
      slides = imported;
      currentSlide = 0; selectedEl = null;
      document.getElementById('docName').value = file.name.replace(/\.[^.]+$/,'');
      document.title = file.name.replace(/\.[^.]+$/,'') + ' — Slides';
      renderAll(); scheduleAutosave();
    }catch(err){
      alert('Could not import "' + file.name + '". ' + err.message);
    }
    e.target.value = '';
  };
  inp.click();
}

async function parsePptx(zip){
  const pres = zip.file('ppt/presentation.xml');
  if(!pres) throw new Error('Not a valid .pptx file.');
  const presDoc = new DOMParser().parseFromString(await pres.async('text'), 'application/xml');
  const sldSz = presDoc.getElementsByTagName('p:sldSz')[0];
  const slideW = sldSz ? parseFloat(sldSz.getAttribute('cx')) : 12192000;
  const slideH = sldSz ? parseFloat(sldSz.getAttribute('cy')) : 6858000;

  const slideFiles = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=> parseInt(a.match(/\d+/)[0],10) - parseInt(b.match(/\d+/)[0],10));

  const result = [];
  for(const sf of slideFiles){
    const num = parseInt(sf.match(/\d+/)[0],10);
    const slideXml = await zip.file(sf).async('text');
    const rels = await getRels(zip, num);
    result.push(await parseSlide(zip, slideXml, rels, slideW, slideH, num));
  }
  return result;
}

async function getRels(zip, num){
  const f = zip.file('ppt/slides/_rels/slide'+num+'.xml.rels');
  if(!f) return {};
  const doc = new DOMParser().parseFromString(await f.async('text'), 'application/xml');
  const map = {};
  Array.from(doc.getElementsByTagName('Relationship')).forEach(r=>{
    let target = r.getAttribute('Target') || '';
    target = target.replace(/^\//,'').replace(/^\.\.\//,'ppt/');
    map[r.getAttribute('Id')] = target;
  });
  return map;
}

function parseTextBody(txBody){
  const paras = txBody.getElementsByTagName('a:p');
  let text = '';
  let fontSize = 24, bold = false, italic = false, color = '#202124', align = 'left';
  for(let pi=0; pi<paras.length; pi++){
    const para = paras[pi];
    if(pi>0) text += '\n';
    const pPr = para.getElementsByTagName('a:pPr')[0];
    if(pPr){
      const algn = pPr.getAttribute('algn');
      if(algn==='ctr') align = 'center';
      else if(algn==='r') align = 'right';
      else if(algn==='l') align = 'left';
    }
    Array.from(para.getElementsByTagName('a:r')).forEach(run=>{
      const rPr = run.getElementsByTagName('a:rPr')[0];
      if(rPr){
        const sz = rPr.getAttribute('sz');
        if(sz) fontSize = parseInt(sz,10)/100;
        if(rPr.getAttribute('b')==='1') bold = true;
        if(rPr.getAttribute('i')==='1') italic = true;
        const fill = rPr.getElementsByTagName('a:solidFill')[0];
        if(fill){
          const col = fill.getElementsByTagName('a:srgbClr')[0];
          if(col) color = '#' + col.getAttribute('val');
        }
      }
      const t = run.getElementsByTagName('a:t')[0];
      if(t && t.textContent) text += t.textContent;
    });
    Array.from(para.getElementsByTagName('a:br')).forEach(()=>{ text += '\n'; });
  }
  if(!text.trim()) text = ' ';
  fontSize = Math.max(10, Math.min(72, Math.round(fontSize)||24));
  return { id:uid(), type:'text', text, fontSize, bold, italic, color, align };
}

function toDataURL(blob){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result);
    r.readAsDataURL(blob);
  });
}

async function parseSlide(zip, slideXml, rels, slideW, slideH, num){
  const doc = new DOMParser().parseFromString(slideXml, 'application/xml');
  const sld = doc.getElementsByTagName('p:sld')[0];
  let bg = '#ffffff';
  const bgEl = sld.getElementsByTagName('p:bg')[0];
  if(bgEl){
    const col = bgEl.getElementsByTagName('a:srgbClr')[0];
    if(col) bg = '#' + col.getAttribute('val');
  }
  const elements = [];
  const spTree = sld.getElementsByTagName('p:spTree')[0];
  if(spTree){
    const items = [];
    (function collect(node){
      Array.from(node.children).forEach(ch=>{
        if(ch.tagName==='p:sp' || ch.tagName==='p:pic') items.push(ch);
        else if(ch.tagName==='p:grpSp') collect(ch);
      });
    })(spTree);

    for(const item of items){
      const xfrm = item.getElementsByTagName('p:xfrm')[0];
      let x=0,y=0,w=0,h=0;
      if(xfrm){
        const off = xfrm.getElementsByTagName('a:off')[0];
        const ext = xfrm.getElementsByTagName('a:ext')[0];
        if(off){ x = (parseFloat(off.getAttribute('x'))||0)/slideW*100; y = (parseFloat(off.getAttribute('y'))||0)/slideH*100; }
        if(ext){ w = (parseFloat(ext.getAttribute('cx'))||0)/slideW*100; h = (parseFloat(ext.getAttribute('cy'))||0)/slideH*100; }
      }
      if(item.tagName === 'p:pic'){
        const blip = item.getElementsByTagName('a:blip')[0];
        const rEmbed = blip ? blip.getAttribute('r:embed') : null;
        let src = '';
        if(rEmbed && rels[rEmbed]){
          const mediaFile = zip.file(rels[rEmbed]);
          if(mediaFile){
            try{ src = await toDataURL(await mediaFile.async('blob')); }catch(err){ src=''; }
          }
        }
        if(src) elements.push({ id:uid(), type:'image', src, x, y, w, h });
      } else {
        const txBody = item.getElementsByTagName('p:txBody')[0];
        const prstGeom = item.getElementsByTagName('p:prstGeom')[0];
        if(txBody){
          const tb = parseTextBody(txBody);
          if(!prstGeom || tb.text.trim() !== ''){
            elements.push({ ...tb, x, y, w, h });
            continue;
          }
        }
        const prst = prstGeom ? prstGeom.getAttribute('prst') : 'rect';
        let color = '#c5221f';
        const fill = item.getElementsByTagName('a:solidFill')[0];
        if(fill){
          const col = fill.getElementsByTagName('a:srgbClr')[0];
          if(col) color = '#' + col.getAttribute('val');
        }
        const shapeType = (prst==='ellipse'||prst==='oval'||prst==='circle') ? 'ellipse' : 'rect';
        elements.push({ id:uid(), type:'shape', shapeType, color, x, y, w, h });
      }
    }
  }
  let notes = '';
  const notesFile = zip.file('ppt/notesSlides/notesSlide'+num+'.xml');
  if(notesFile){
    try{
      const notesDoc = new DOMParser().parseFromString(await notesFile.async('text'), 'application/xml');
      const body = notesDoc.getElementsByTagName('p:txBody')[0];
      if(body){
        notes = Array.from(body.getElementsByTagName('a:p'))
          .map(p=> Array.from(p.getElementsByTagName('a:t')).map(t=>t.textContent).join(''))
          .filter(Boolean).join('\n');
      }
    }catch(err){ notes=''; }
  }
  return { bg, notes, elements };
}

// ---- Export ----
function exportPptx(){
  const name = (document.getElementById('docName').value || 'presentation').replace(/[^\w\- ]/g,'');
  const pptx = new PptxGenJS();
  pptx.defineLayout({ name:'CUSTOM', width:10, height:5.625 });
  pptx.layout = 'CUSTOM';

  slides.forEach(s=>{
    const slide = pptx.addSlide();
    slide.background = { color: s.bg.replace('#','') };
    s.elements.forEach(el=>{
      const x = el.x/100*10, y = el.y/100*5.625, w = el.w/100*10, h = el.h/100*5.625;
      if(el.type==='text'){
        slide.addText(el.text, {
          x, y, w, h,
          fontSize: Math.round(el.fontSize*0.75),
          bold: el.bold, italic: el.italic,
          color: el.color.replace('#',''),
          align: el.align, fontFace: 'Arial', valign:'top'
        });
      } else if(el.type==='image'){
        slide.addImage({ data: el.src, x, y, w, h });
      } else if(el.type==='shape'){
        const shapeType = el.shapeType==='ellipse' ? pptx.ShapeType.ellipse : pptx.ShapeType.rect;
        slide.addShape(shapeType, { x, y, w, h, fill:{color: el.color.replace('#','')} });
      }
    });
    if(s.notes) slide.addNotes(s.notes);
  });

  pptx.writeFile({ fileName: name + '.pptx' });
}

document.getElementById('docName').addEventListener('input', e=>{

  scheduleAutosave();
});

// ---- Local persistence (browser localStorage) ----
function trySet(key,val){ try{ localStorage.setItem(key, val); return true; }catch(e){ return false; } }
function tryGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function tryDelete(key){ try{ localStorage.removeItem(key); return true; }catch(e){ return false; } }
function tryListKeys(prefix){ try{ return Object.keys(localStorage).filter(k=>k.startsWith(prefix)); }catch(e){ return []; } }

function toggleTheme(){
  document.body.classList.toggle('dark');
  const dark = document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  trySet('slides-theme', dark ? 'dark' : 'light');
}
(function initTheme(){
  if(tryGet('slides-theme')==='dark'){ document.body.classList.add('dark'); document.getElementById('themeBtn').textContent='☀️'; }
})();

// ---- Autosave ----
var autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  const dot = document.getElementById('autosaveDot'), label = document.getElementById('autosaveLabel');
  if(dot) dot.classList.add('saving');
  if(label) label.textContent = 'Editing…';
  autosaveTimer = setTimeout(doAutosave, 1500);
}
function doAutosave(){
  const ok = trySet('slides-autosave', JSON.stringify({ slides, docName: document.getElementById('docName').value, savedAt: Date.now() }));
  const dot = document.getElementById('autosaveDot'), label = document.getElementById('autosaveLabel');
  if(dot) dot.classList.remove('saving');
  if(label) label.textContent = ok ? 'Saved just now' : 'Autosave unavailable';
}
function checkAutosaveOnLoad(){
  const raw = tryGet('slides-autosave');
  if(!raw) return;
  try{
    const data = JSON.parse(raw);
    if(data.slides && JSON.stringify(data.slides) !== JSON.stringify(slides)){
      document.getElementById('restoreBanner').style.display = 'flex';
      window._pendingAutosave = data;
    }
  }catch(e){ /* corrupted, ignore */ }
}
function restoreAutosave(){
  if(window._pendingAutosave){
    slides = window._pendingAutosave.slides;
    currentSlide = 0; selectedEl = null;
    document.getElementById('docName').value = window._pendingAutosave.docName || 'Untitled presentation';
    renderAll();
  }
  document.getElementById('restoreBanner').style.display = 'none';
}
function dismissAutosave(){ document.getElementById('restoreBanner').style.display = 'none'; }
checkAutosaveOnLoad();

// ---- Version history ----
function openVersions(){ document.getElementById('versionModal').style.display='flex'; renderVersionList(); }
function closeVersions(){ document.getElementById('versionModal').style.display='none'; }
function saveVersion(){
  const label = prompt('Name this version (optional):', new Date().toLocaleString());
  if(label===null) return;
  const key = 'slides-version:' + Date.now();
  const ok = trySet(key, JSON.stringify({ label, slides, docName: document.getElementById('docName').value }));
  if(ok) renderVersionList();
  else alert('Could not save version — your browser storage may be full or disabled for this page.');
}
function renderVersionList(){
  const listEl = document.getElementById('versionList');
  const keys = tryListKeys('slides-version:').sort().reverse();
  if(!keys.length){ listEl.innerHTML = '<div class="hint">No saved versions yet.</div>'; return; }
  listEl.innerHTML = '';
  keys.forEach(key=>{
    let data;
    try{ data = JSON.parse(tryGet(key)); }catch(e){ return; }
    if(!data) return;
    const row = document.createElement('div');
    row.className = 'version-item';
    const ts = key.split(':')[1];
    const date = ts ? new Date(parseInt(ts)).toLocaleString() : '';
    row.innerHTML = `<div><div>${data.label || 'Untitled version'}</div><div class="meta">${date}</div></div>`;
    const btns = document.createElement('div');
    const restoreBtn = document.createElement('button'); restoreBtn.className='small-btn primary'; restoreBtn.textContent='Restore';
    restoreBtn.onclick = ()=>{
      slides = data.slides; currentSlide = 0; selectedEl = null;
      document.getElementById('docName').value = data.docName || 'Untitled presentation';
      renderAll();
      closeVersions();
    };
    const delBtn = document.createElement('button'); delBtn.className='small-btn'; delBtn.style.marginLeft='6px'; delBtn.textContent='Delete';
    delBtn.onclick = ()=>{ tryDelete(key); renderVersionList(); };
    btns.appendChild(restoreBtn); btns.appendChild(delBtn);
    row.appendChild(btns);
    listEl.appendChild(row);
  });
}

// ---- Templates ----
const SLIDE_TEMPLATES = {
  'Blank deck': ()=> [ makeSlide() ],
  'Title slide only': ()=> [{
    bg:'#ffffff', notes:'',
    elements:[
      { id:uid(), type:'text', x:10, y:38, w:80, h:18, text:'Presentation Title', fontSize:48, bold:true, italic:false, color:'#202124', align:'center' },
      { id:uid(), type:'text', x:10, y:58, w:80, h:10, text:'Subtitle or presenter name', fontSize:20, bold:false, italic:false, color:'#5f6368', align:'center' },
    ]
  }],
  'Agenda': ()=> [{
    bg:'#ffffff', notes:'',
    elements:[
      { id:uid(), type:'text', x:8, y:8, w:84, h:14, text:'Agenda', fontSize:38, bold:true, italic:false, color:'#202124', align:'left' },
      { id:uid(), type:'text', x:10, y:28, w:80, h:60, text:'1. Welcome and introductions\n2. Project update\n3. Open discussion\n4. Next steps', fontSize:22, bold:false, italic:false, color:'#3c4043', align:'left' },
    ]
  }],
  'Image + caption': ()=> [{
    bg:'#ffffff', notes:'',
    elements:[
      { id:uid(), type:'shape', shapeType:'rect', x:15, y:12, w:70, h:55, color:'#e8eaed' },
      { id:uid(), type:'text', x:15, y:70, w:70, h:12, text:'Caption goes here — click "+ Image" to replace the placeholder box above.', fontSize:16, bold:false, italic:true, color:'#5f6368', align:'center' },
    ]
  }],
};
function openTemplates(){
  const listEl = document.getElementById('templateList');
  listEl.innerHTML = '';
  Object.keys(SLIDE_TEMPLATES).forEach(name=>{
    const item = document.createElement('div');
    item.className = 'template-item';
    item.textContent = name;
    item.onclick = ()=>{
      if(confirm('Replace current presentation with the "'+name+'" template?')){
        slides = SLIDE_TEMPLATES[name]();
        currentSlide = 0; selectedEl = null;
        renderAll();
        scheduleAutosave();
        closeTemplates();
      }
    };
    listEl.appendChild(item);
  });
  document.getElementById('templateModal').style.display = 'flex';
}
function closeTemplates(){ document.getElementById('templateModal').style.display = 'none'; }

</script>
