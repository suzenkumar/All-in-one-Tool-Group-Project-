<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AllInOne — Live Code Editor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ═══════════ TITLE BAR ═══════════ -->
<header id="titlebar">
  <div class="brand">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </span>
    <span class="brand-name">AllInOne <em>Live Editor</em></span>
  </div>

  <div class="tb-center">
    <button class="tb-btn btn-run" id="runBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M6 3l14 9-14 9V3z"/></svg>
      Run
    </button>
    <button class="tb-btn ghost" id="refreshBtn" title="Reload preview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>

    <div class="fw-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      <select id="fwSelect">
        <option value="vanilla">Vanilla</option>
        <option value="react">React (JSX)</option>
        <option value="vue">Vue 3</option>
        <option value="tailwind">Tailwind CSS</option>
      </select>
    </div>

    <button class="tb-btn ai" id="aiToggleBtn" title="Toggle AI-assisted code suggestions">
      <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z"/><path d="M19 14l.9 2.7L22 17.6l-2.1.9L19 21l-.9-2.5-2.1-.9 2.1-.9L19 14z" opacity=".7"/></svg>
      AI Suggest <span class="ai-state" id="aiState">Off</span>
    </button>
  </div>

  <div class="tb-right">
    <div class="dl-wrap">
      <button class="tb-btn ghost" id="downloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
      <div class="dl-menu" id="dlMenu" hidden>
        <button data-dl="html">index.html <span>.html</span></button>
        <button data-dl="css">style.css <span>.css</span></button>
        <button data-dl="js">script.js <span>.js</span></button>
        <button data-dl="code">Code file <span id="codeExt">.txt</span></button>
        <div class="dl-sep"></div>
        <button data-dl="zip">Full project <span>.zip</span></button>
      </div>
    </div>

    <button class="tb-btn ghost" id="fullBtn" title="Toggle fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      Fullscreen
    </button>
    <button class="tb-btn danger" id="clearBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Clear
    </button>
  </div>
</header>

<!-- ═══════════ WORKSPACE ═══════════ -->
<main id="workspace">

  <!-- Editors -->
  <section id="editorsPanel">
    <nav class="tab-bar" id="tabBar">
      <button class="tab active" data-tab="html"><span class="dot dot-html"></span>index.html</button>
      <button class="tab" data-tab="css"><span class="dot dot-css"></span>style.css</button>
      <button class="tab" data-tab="js"><span class="dot dot-js"></span>script.js</button>
      <button class="tab tab-code" data-tab="code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>
        Code
      </button>
      <button class="tab tab-preview" data-tab="preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
    </nav>

    <div class="editors-wrap" id="editorsWrap">
      <div class="editor-area active" data-ed="html">
        <textarea id="html-code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
      <div class="editor-area" data-ed="css">
        <textarea id="css-code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
      <div class="editor-area" data-ed="js">
        <textarea id="js-code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
      <div class="editor-area" data-ed="code">
        <div class="code-toolbar">
          <span class="ct-label">Code</span>
          <div class="lang-pick" id="langPick">
            <button type="button" class="lang-btn" id="langBtn">
              <span id="langBtnLabel">Python</span>
              <svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="lang-pop" id="langPop" hidden>
              <input class="lang-search" id="langSearch" type="text" placeholder="Search languages…" autocomplete="off" spellcheck="false"/>
              <div class="lang-list" id="langList"></div>
            </div>
          </div>
        </div>
        <div class="code-cm-wrap">
          <textarea id="code-code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        </div>
      </div>
    </div>
  </section>

  <div id="resizeHandle"></div>

  <!-- Preview -->
  <section id="previewPanel">
    <div class="panel-head">
      <span class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="13" height="13" style="margin-right:7px"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Live Preview
      </span>
      <div class="panel-actions">
        <button class="pp-btn" id="fullBtn2" title="Fullscreen preview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <button class="pp-btn" id="refreshBtn2" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </div>
    <div id="frameWrap">
      <iframe id="output" sandbox="allow-scripts allow-same-origin allow-forms allow-modals" title="Live preview"></iframe>
      <div id="previewEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="46" height="46"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>
        <div>Your live preview will appear here</div>
      </div>
    </div>
  </section>

</main>

<!-- ═══════════ STATUS BAR ═══════════ -->
<footer id="statusbar">
  <span id="sbLang">index.html</span>
  <span id="sbCursor">Ln 1, Col 1</span>
  <span id="sbWords">0 words</span>
  <span class="spacer"></span>
  <span class="sb-live"><span class="sb-dot"></span>Preview live</span>
  <span id="sbSave">Saved</span>
</footer>

<div id="toast"></div>
<div id="acBox" class="ac-box" hidden></div>
<div id="aiStrip" class="ai-strip" hidden><span class="ai-strip-dot"></span><span id="aiStripText">Thinking of a suggestion…</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script src="script.js"></script>
</body>
</html>
