<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Margdarshak — Your AI Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141834;
    --ink-2:#232B52;
    --ink-glow: rgba(227,162,60,0.18);
    --paper:#FAF7F0;
    --paper-line:#EAE1CC;
    --amber:#E3A23C;
    --amber-dark:#C17F22;
    --amber-light:#F6D89B;
    --sage:#6F9779;
    --sage-light:#DCE9DF;
    --terra:#C1573D;
    --terra-light:#F3DAD2;
    --violet:#8568B0;
    --violet-light:#E4DBF0;
    --charcoal:#20232B;
    --muted:#7A7367;
    --white:#FFFFFF;
    --radius:14px;
    --shadow: 0 10px 30px rgba(20,24,52,0.14);
    --accent: var(--amber);
    --accent-light: var(--amber-light);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background: var(--ink);
    color: var(--charcoal);
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  ::selection{ background: var(--accent-light); }

  /* ===== Left rail ===== */
  .rail{
    width:104px;
    background: radial-gradient(circle at 30% 0%, #1D2350 0%, var(--ink) 55%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:26px;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .rail::before{
    content:'';
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 14px 14px;
    opacity:0.5;
    pointer-events:none;
  }
  .brand{
    position:relative;
    width:44px; height:44px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(145deg, var(--amber), var(--terra));
    font-family:'Lora', serif;
    font-weight:700;
    font-size:19px;
    color:#1A1330;
    margin-bottom:34px;
    box-shadow: 0 6px 18px rgba(227,162,60,0.35);
  }
  .tab{
    position:relative;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    width:100%;
    padding: 20px 0 16px 0;
    margin-bottom:4px;
    font-family:'Lora', serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:1.2px;
    color: rgba(255,255,255,0.5);
    background: transparent;
    border:none;
    cursor:pointer;
    text-align:center;
    transition: all 0.25s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .tab .ticon{
    writing-mode: horizontal-tb;
    transform: rotate(180deg);
    font-size:16px;
    opacity:0.65;
    transition: all 0.25s ease;
  }
  .tab:hover{ color: rgba(255,255,255,0.9); }
  .tab:hover .ticon{ opacity:1; transform: rotate(180deg) translateY(-2px); }
  .tab.active{
    color: var(--ink);
    background: var(--paper);
    border-radius: 0 16px 16px 0;
    margin-right:-1px;
    box-shadow: -2px 0 20px rgba(0,0,0,0.15);
  }
  .tab.active .ticon{ opacity:1; }
  .tab.active[data-mode="study"] .ticon{ color: var(--amber-dark); }
  .tab.active[data-mode="career"] .ticon{ color: var(--sage); }
  .tab.active[data-mode="interview"] .ticon{ color: var(--terra); }
  .tab.active[data-mode="parent"] .ticon{ color: var(--violet); }
  .tab.active::before{
    content:'';
    position:absolute; left:0; top:14px; bottom:14px; width:4px;
    border-radius:0 4px 4px 0;
  }
  .tab.active[data-mode="study"]::before{ background: var(--amber); }
  .tab.active[data-mode="career"]::before{ background: var(--sage); }
  .tab.active[data-mode="interview"]::before{ background: var(--terra); }
  .tab.active[data-mode="parent"]::before{ background: var(--violet); }

  .rail-bottom{
    margin-top:auto; margin-bottom:22px;
    font-size:9.5px; color: rgba(255,255,255,0.3);
    writing-mode: vertical-rl; letter-spacing:2px;
  }

  /* ===== Main area ===== */
  .main{
    flex:1;
    background: var(--paper);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .topbar{
    padding: 22px 34px 18px 34px;
    border-bottom: 1px solid var(--paper-line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper) 100%);
    position:relative;
  }
  .topbar::after{
    content:'';
    position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 45%);
    transition: background 0.35s ease;
  }
  .topbar-left{ display:flex; align-items:center; gap:13px; }
  .mode-badge{
    width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
    background: var(--accent-light);
    color: var(--accent-dark, var(--ink));
    flex-shrink:0;
    transition: all 0.3s ease;
  }
  .topbar-title{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:21px;
    color: var(--ink);
    letter-spacing:-0.2px;
  }
  .topbar-sub{
    font-size:12.5px;
    color: var(--muted);
    margin-top:1px;
  }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  select, .btn-small{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:9px 12px;
    border-radius:9px;
    border:1px solid var(--paper-line);
    background: var(--white);
    color: var(--ink-2);
    cursor:pointer;
    transition: all 0.15s ease;
  }
  select:hover, .btn-small:hover{ border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  /* ===== Chat area ===== */
  .chat-scroll{
    flex:1;
    overflow-y:auto;
    padding: 32px 8% 20px 8%;
    background:
      radial-gradient(ellipse 900px 400px at 50% 0%, var(--ink-glow), transparent 60%),
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 38px, var(--paper-line) 39px);
    background-attachment: local, local;
    transition: background 0.4s ease;
  }
  .chat-scroll::-webkit-scrollbar{ width:9px; }
  .chat-scroll::-webkit-scrollbar-thumb{ background: var(--paper-line); border-radius:10px; }
  .chat-scroll::-webkit-scrollbar-thumb:hover{ background: var(--accent-light); }

  @keyframes riseIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .msg{
    max-width: 720px;
    margin: 0 auto 20px auto;
    display:flex;
    gap:12px;
    align-items:flex-end;
    animation: riseIn 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .msg.user{ flex-direction: row-reverse; }
  .avatar{
    width:32px; height:32px; border-radius:10px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    color:#fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  .msg.assistant .avatar{ background: linear-gradient(155deg, var(--ink-2), var(--ink)); }
  .msg.user .avatar{ background: linear-gradient(155deg, var(--accent), var(--amber-dark)); }
  .bubble{
    background: var(--white);
    padding: 14px 17px;
    border-radius: var(--radius);
    box-shadow: 0 2px 10px rgba(20,24,52,0.06);
    font-size:14.5px;
    line-height:1.65;
    white-space:pre-wrap;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .msg.assistant .bubble{ border-bottom-left-radius:4px; border-left: 3px solid var(--accent); }
  .msg.user .bubble{ background: linear-gradient(155deg, #FFF8EA, #FFF1D8); border-bottom-right-radius:4px; }
  .bubble strong{ color: var(--ink); font-weight:700; }
  .bubble code{
    font-family:'JetBrains Mono', monospace;
    background: #F1EEE4;
    padding:2px 6px;
    border-radius:5px;
    font-size:13px;
  }

  .empty-state{
    max-width:580px;
    margin: 52px auto;
    text-align:center;
    color: var(--muted);
    animation: riseIn 0.4s ease;
  }
  .empty-glyph{
    width:72px; height:72px;
    margin:0 auto 18px auto;
    border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:32px;
    background: linear-gradient(155deg, var(--accent-light), var(--white));
    box-shadow: var(--shadow);
  }
  .empty-state h2{
    font-family:'Lora', serif;
    color: var(--ink);
    font-size:21px;
    margin-bottom:6px;
    letter-spacing:-0.2px;
  }
  .empty-state p{ font-size:13.5px; }
  .suggestions{
    display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:20px;
  }
  .chip{
    background: var(--white);
    border:1px solid var(--paper-line);
    padding:9px 15px;
    border-radius:22px;
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    color: var(--ink-2);
    transition: all 0.15s ease;
  }
  .chip:hover{ border-color: var(--accent); color: var(--amber-dark); background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

  .typing{ display:flex; gap:4px; padding:6px 2px; }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform: translateY(0); opacity:0.4;} 40%{ transform: translateY(-4px); opacity:1;} }

  .keybanner{
    max-width:720px; margin:0 auto 18px auto;
    background: linear-gradient(155deg, var(--terra-light), #fff);
    border:1px solid #E9C6BA;
    border-radius:12px;
    padding:12px 16px;
    font-size:12.5px;
    color:#7A3A28;
    display:flex; gap:10px; align-items:flex-start;
    line-height:1.5;
  }
  .keybanner code{ background:#fff; padding:2px 6px; border-radius:5px; font-family:'JetBrains Mono',monospace; }

  /* ===== Composer ===== */
  .composer{
    padding: 16px 8% 20px 8%;
    background: var(--paper);
  }
  .composer-inner{
    max-width:720px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background: var(--white);
    border:1.5px solid var(--paper-line);
    border-radius: 16px;
    padding: 9px 9px 9px 18px;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
  }
  .composer-inner:focus-within{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ink-glow), var(--shadow);
  }
  textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    line-height:1.5;
    max-height:140px;
    padding:9px 0;
    background:transparent;
  }
  .send-btn{
    background: linear-gradient(155deg, var(--ink-2), var(--ink));
    color: var(--accent);
    border:none;
    width:40px; height:40px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.12s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 12px rgba(20,24,52,0.25);
  }
  .send-btn:hover{ transform: translateY(-1px); box-shadow: 0 6px 16px rgba(20,24,52,0.32); }
  .send-btn:active{ transform: scale(0.92); }
  .send-btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .disclaimer{
    text-align:center; font-size:11px; color: var(--muted); margin-top:10px;
  }

  @media (max-width: 720px){
    .rail{ width:68px; }
    .brand{ width:36px; height:36px; font-size:15px; margin-bottom:20px; }
    .tab{ font-size:11px; padding:14px 0; }
    .tab .ticon{ font-size:14px; }
    .chat-scroll{ padding: 20px 4% 16px 4%; }
    .composer{ padding: 12px 4% 16px 4%; }
    .topbar{ padding: 16px 18px 14px 18px; }
    .topbar-title{ font-size:17px; }
  }
</style>
</head>
<body>

  <div class="rail">
    <div class="brand">म</div>
    <button class="tab active" data-mode="study"><span class="ticon">📘</span>Study</button>
    <button class="tab" data-mode="career"><span class="ticon">🧭</span>Career</button>
    <button class="tab" data-mode="interview"><span class="ticon">🎤</span>Interview</button>
    <button class="tab" data-mode="parent"><span class="ticon">👪</span>Parents</button>
    <div class="rail-bottom">MARGDARSHAK</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="mode-badge" id="modeBadge">📘</div>
        <div>
          <div class="topbar-title" id="modeTitle">Study Help</div>
          <div class="topbar-sub" id="modeSub">Ask about any concept, problem, or subject — I'll explain it step by step.</div>
        </div>
      </div>
      <div class="topbar-right">
        <select id="modelSelect">
          <option value="gemini-3.6-flash">Gemini 3.6 Flash (smartest)</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (fastest)</option>
        </select>
        <button class="btn-small" id="clearBtn">Clear chat</button>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="empty-glyph" id="emptyGlyph">📘</div>
        <h2 id="emptyTitle">What are you working on?</h2>
        <p id="emptySub">Pick a suggestion below or type your own question.</p>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div id="messages"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Type your question..."></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
      <div class="disclaimer">Runs entirely in your browser using the free Gemini API · AI can make mistakes, verify important information.</div>
    </div>
  </div>

<script>
/* ============================================================
   PASTE YOUR FREE GEMINI API KEY BELOW (get one, no card needed,
   at https://aistudio.google.com/apikey)
   ============================================================ */
const GEMINI_API_KEY = "AQ.Ab8RN6L_hAjkj_CibAhXCBr2mdaI_knvX49eBB9MfHlbdBharw";
/* ============================================================ */

const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta/models";
// Google renames/retires Gemini model IDs fairly often. If the selected model
// comes back "no longer available", we automatically retry with the next
// model in its fallback chain instead of just failing.
const FALLBACK_CHAINS = {
  "gemini-3.6-flash": ["gemini-3.6-flash", "gemini-flash-latest", "gemini-2.5-flash"],
  "gemini-3.5-flash-lite": ["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"]
};

const MODES = {
  study: {
    title: "Study Help",
    sub: "Ask about any concept, problem, or subject — I'll explain it step by step.",
    icon: "📘",
    accent: "amber",
    avatar: "📘",
    system: "You are Margdarshak, a patient and encouraging study tutor for college students. Explain concepts clearly with simple language and concrete examples. Break problems into steps and check the student's understanding before moving on — guide them to the answer rather than just handing it over, unless they explicitly ask for the direct solution. Use headings, bullet points, and code blocks where useful. Keep tone supportive, never condescending.",
    suggestions: ["Explain time complexity with an example", "Help me solve this calculus problem", "Quiz me on DBMS normalization", "Summarize the OSI model"]
  },
  career: {
    title: "Career Guidance",
    sub: "Explore career paths, skills to build, and how to plan your next steps.",
    icon: "🧭",
    accent: "sage",
    avatar: "🧭",
    system: "You are Margdarshak, an experienced and honest career counselor for college students and early professionals, especially in the Indian job market context. Help with career path exploration, skill-building roadmaps, higher-studies vs job decisions, resume direction, and industry realities. Ask clarifying questions about their branch, interests, and constraints when it helps you give better advice. Be practical and specific, not generic motivational talk.",
    suggestions: ["I'm a 2nd year CSE student, what should I focus on?", "Should I go for higher studies or a job?", "How do I switch from mechanical to data science?", "What skills matter most for product management?"]
  },
  interview: {
    title: "Interview Prep",
    sub: "Practice mock interviews and get direct, constructive feedback.",
    icon: "🎤",
    accent: "terra",
    avatar: "🎤",
    system: "You are Margdarshak, an interview coach. Conduct realistic mock interviews (HR, technical, or behavioral, based on what the student specifies). Ask ONE question at a time and wait for their answer before continuing. After each answer, give brief, direct feedback: what was strong, what to improve, and a short model answer if useful. Adapt difficulty and domain to the role the student mentions. If they haven't specified a role or interview type, ask first.",
    suggestions: ["Mock HR interview for a fresher", "Technical interview for a Java developer role", "Practice 'Tell me about yourself'", "Behavioral question on teamwork conflict"]
  },
  parent: {
    title: "Parent Counseling",
    sub: "Support for parents navigating their child's education and career choices.",
    icon: "👪",
    accent: "violet",
    avatar: "👪",
    system: "You are Margdarshak, a warm and culturally sensitive counselor speaking with a parent about their child's education and career journey. Help parents understand modern career options and exam/stream systems, ease anxiety around results or comparisons with other children, and suggest ways to support their child's ambitions and wellbeing without adding excess pressure. Be respectful of family and cultural context, empathetic, and practical rather than clinical.",
    suggestions: ["My child wants to switch from engineering to arts", "How do I talk to my daughter about low exam marks?", "Is a government job still the safest choice?", "My son is stressed about placements, how can I help?"]
  }
};

const ACCENT_VARS = {
  amber: { light: '#F6D89B', main: '#E3A23C' },
  sage: { light: '#DCE9DF', main: '#6F9779' },
  terra: { light: '#F3DAD2', main: '#C1573D' },
  violet: { light: '#E4DBF0', main: '#8568B0' }
};

let currentMode = "study";
let histories = { study: [], career: [], interview: [], parent: [] };
let isSending = false;

const chatScroll = document.getElementById('chatScroll');
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const emptyGlyph = document.getElementById('emptyGlyph');
const emptyTitle = document.getElementById('emptyTitle');
const emptySub = document.getElementById('emptySub');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const modeBadge = document.getElementById('modeBadge');
const modeTitle = document.getElementById('modeTitle');
const modeSub = document.getElementById('modeSub');
const suggestionsEl = document.getElementById('suggestions');
const modelSelect = document.getElementById('modelSelect');

function hasApiKey(){
  return GEMINI_API_KEY && GEMINI_API_KEY !== "PASTE_YOUR_GEMINI_API_KEY_HERE";
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchMode(tab.dataset.mode));
});

function switchMode(mode){
  currentMode = mode;
  const m = MODES[mode];
  const acc = ACCENT_VARS[m.accent];
  document.documentElement.style.setProperty('--accent', acc.main);
  document.documentElement.style.setProperty('--accent-light', acc.light);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  modeBadge.textContent = m.icon;
  modeBadge.style.background = acc.light;
  modeTitle.textContent = m.title;
  modeSub.textContent = m.sub;
  emptyGlyph.textContent = m.icon;
  emptyTitle.textContent = mode === 'study' ? "What are you working on?" :
    mode === 'career' ? "Where do you want your career to go?" :
    mode === 'interview' ? "Ready to practice?" :
    "How can I help you support your child?";
  renderSuggestions();
  renderMessages();
}

function renderSuggestions(){
  suggestionsEl.innerHTML = '';
  MODES[currentMode].suggestions.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = s;
    chip.onclick = () => { input.value = s; input.focus(); autoGrow(); };
    suggestionsEl.appendChild(chip);
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatContent(text){
  let safe = escapeHtml(text);
  safe = safe.replace(/```([\s\S]*?)```/g, (m, code) => `<code style="display:block;white-space:pre-wrap;padding:8px;">${code}</code>`);
  safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return safe;
}

function renderMessages(){
  const hist = histories[currentMode];
  messagesEl.innerHTML = '';
  emptyState.style.display = hist.length === 0 ? 'block' : 'none';

  if (!hasApiKey() && hist.length === 0){
    const banner = document.createElement('div');
    banner.className = 'keybanner';
    banner.innerHTML = `⚠️ <div>No Gemini API key set yet. Open <code>index.html</code> in a text editor, find <code>GEMINI_API_KEY</code> near the top of the &lt;script&gt;, and paste in a free key from <code>aistudio.google.com/apikey</code>.</div>`;
    messagesEl.appendChild(banner);
  }

  hist.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = m.role === 'user' ? '🙂' : MODES[currentMode].avatar;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatContent(m.content);
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  });
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function autoGrow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
sendBtn.addEventListener('click', handleSend);

async function handleSend(){
  const text = input.value.trim();
  if (!text || isSending) return;

  if (!hasApiKey()){
    histories[currentMode].push({ role:'assistant', content: `⚠️ No API key configured. Open index.html in a text editor and paste a free Gemini key into the GEMINI_API_KEY constant near the top of the <script> tag. Get one at aistudio.google.com/apikey.` });
    renderMessages();
    return;
  }

  histories[currentMode].push({ role:'user', content:text });
  input.value = '';
  autoGrow();
  renderMessages();
  showTyping();
  isSending = true;
  sendBtn.disabled = true;

  try{
    const contents = histories[currentMode].map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.content }]
    }));

    const requestBody = JSON.stringify({
      contents,
      systemInstruction: { parts: [{ text: MODES[currentMode].system }] },
      generationConfig: { temperature: 0.6, maxOutputTokens: 1024 }
    });

    const chain = FALLBACK_CHAINS[modelSelect.value] || [modelSelect.value];
    let res, lastErrMsg = '';

    for (const modelId of chain){
      const url = `${GEMINI_BASE}/${modelId}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;
      res = await fetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: requestBody
      });
      if (res.ok) break;
      const errBody = await res.json().catch(() => ({}));
      lastErrMsg = errBody?.error?.message || `Request failed (status ${res.status})`;
      if (res.status !== 404 && !/no longer available/i.test(lastErrMsg)) break;
    }

    hideTyping();

    if (!res.ok){
      histories[currentMode].push({ role:'assistant', content: `⚠️ ${lastErrMsg}\n\nIf this says the API key is invalid, double-check the GEMINI_API_KEY value near the top of index.html.` });
      renderMessages();
      return;
    }

    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || "Sorry, I couldn't generate a response. The reply may have been blocked by a safety filter — try rephrasing.";
    histories[currentMode].push({ role:'assistant', content: reply });
    renderMessages();
  } catch(err){
    hideTyping();
    histories[currentMode].push({ role:'assistant', content: `⚠️ Network error: ${err.message}. Check your internet connection and try again.` });
    renderMessages();
  } finally {
    isSending = false;
    sendBtn.disabled = false;
  }
}

function showTyping(){
  emptyState.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg assistant';
  row.id = 'typingRow';
  row.innerHTML = `<div class="avatar">${MODES[currentMode].avatar}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}
function hideTyping(){
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

document.getElementById('clearBtn').addEventListener('click', () => {
  histories[currentMode] = [];
  renderMessages();
});

// Init
switchMode('study');
</script>
</body>
