<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Margdarshak — Your AI Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#04081C;
    --bg-1:#081230;
    --bg-2:#0B1B45;
    --panel:rgba(13,27,61,0.55);
    --glass:rgba(255,255,255,0.06);
    --glass-strong:rgba(255,255,255,0.1);
    --line:rgba(148,197,255,0.14);
    --line-strong:rgba(148,197,255,0.28);
    --text:#E7EEFB;
    --text-dim:#9FB3D9;
    --text-faint:#5F75A6;

    --blue:#3B82F6;
    --blue-deep:#1D4ED8;
    --cyan:#22D3EE;
    --sky:#38BDF8;
    --indigo:#6366F1;

    --accent:var(--cyan);
    --accent-deep:#0E7490;
    --accent-light:rgba(34,211,238,0.16);
    --glow:rgba(34,211,238,0.45);

    --radius:16px;
    --shadow-deep: 0 22px 50px -18px rgba(2,8,28,0.9);
    --shadow-soft: 0 10px 30px -12px rgba(2,8,28,0.8);
    --press: translateY(0);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background: var(--bg-0);
    color: var(--text);
    display:flex;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    position:relative;
  }
  ::selection{ background: var(--accent-light); color:#fff; }

  /* ===== 3D backdrop: gradient space + floating orbs + grid ===== */
  .bg{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(56,120,255,0.22), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(34,211,238,0.14), transparent 60%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
  }
  .bg .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(120,170,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    transform: perspective(600px) rotateX(58deg) scale(1.6) translateY(12%);
    transform-origin: 50% 100%;
    mask-image: linear-gradient(180deg, transparent, #000 55%);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 55%);
    opacity:.5;
  }
  .orb{
    position:absolute; border-radius:50%;
    filter: blur(2px);
    pointer-events:none;
    will-change: transform;
  }
  .o1{
    width:420px; height:420px; top:-120px; right:-90px;
    background: radial-gradient(circle at 32% 30%, rgba(120,180,255,0.5), rgba(37,99,235,0.18) 55%, transparent 72%);
    box-shadow: inset -30px -30px 90px rgba(4,10,30,0.8), inset 20px 20px 70px rgba(150,200,255,0.35);
    animation: float1 14s ease-in-out infinite;
  }
  .o2{
    width:300px; height:300px; bottom:-80px; left:-60px;
    background: radial-gradient(circle at 34% 30%, rgba(34,211,238,0.45), rgba(14,116,144,0.15) 55%, transparent 72%);
    box-shadow: inset -22px -22px 70px rgba(4,10,30,0.8), inset 16px 16px 55px rgba(140,240,255,0.35);
    animation: float2 18s ease-in-out infinite;
  }
  .o3{
    width:200px; height:200px; top:42%; left:18%;
    background: radial-gradient(circle at 32% 30%, rgba(99,102,241,0.4), rgba(49,46,129,0.14) 55%, transparent 72%);
    box-shadow: inset -14px -14px 50px rgba(4,10,30,0.8), inset 12px 12px 40px rgba(160,170,255,0.35);
    animation: float1 22s ease-in-out infinite reverse;
    opacity:.8;
  }
  @keyframes float1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-34px,44px) scale(1.06);} }
  @keyframes float2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-30px) scale(1.05);} }

  /* ===== Left rail (desktop) ===== */
  .rail{
    width:112px;
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    padding:22px 0 18px 0;
    flex-shrink:0;
    background: linear-gradient(180deg, rgba(12,24,58,0.72), rgba(6,12,36,0.55));
    border-right:1px solid var(--line);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .brand{
    position:relative;
    width:46px; height:46px;
    margin-bottom:34px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif; font-weight:800; font-size:20px;
    color:#fff;
    background: linear-gradient(145deg, #4F8DF9, #1D4ED8);
    box-shadow:
      0 0 0 1px rgba(150,200,255,0.35),
      0 10px 24px -6px var(--glow),
      inset 0 2px 6px rgba(255,255,255,0.45),
      inset 0 -6px 12px rgba(6,20,60,0.55);
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    animation: brandFloat 5s ease-in-out infinite;
  }
  @keyframes brandFloat{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-4px) rotate(-3deg);} }
  .tab{
    position:relative;
    width:100%;
    padding:14px 0;
    margin-bottom:6px;
    font-family:'Sora', sans-serif;
    font-weight:600; font-size:12px; letter-spacing:0.8px;
    color:var(--text-faint);
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:center;
    transition: all 0.25s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column; align-items:center; gap:9px;
  }
  .tab .ticon{
    width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    background: var(--glass);
    border:1px solid var(--line);
    box-shadow: var(--shadow-soft);
    transition: all 0.28s cubic-bezier(.4,0,.2,1);
  }
  .tab:hover{ color: var(--text); }
  .tab:hover .ticon{
    transform: translateY(-3px);
    border-color: var(--line-strong);
    box-shadow: 0 14px 28px -10px rgba(2,8,28,0.9), 0 0 0 1px rgba(148,197,255,0.1);
  }
  .tab.active{
    color: var(--accent);
  }
  .tab.active .ticon{
    background: var(--accent-light);
    border-color: var(--accent);
    color:#fff;
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 16px 34px -12px var(--glow), 0 0 0 1px var(--glow), inset 0 1px 4px rgba(255,255,255,0.35);
    text-shadow: 0 0 12px var(--glow);
  }
  .rail-bottom{
    margin-top:auto;
    font-size:9px; color:var(--text-faint);
    letter-spacing:2.5px; writing-mode:vertical-rl;
    opacity:.6;
  }

  /* ===== Main area ===== */
  .main{
    position:relative; z-index:1;
    flex:1; min-width:0; min-height:0;
    display:flex; flex-direction:column;
  }
  .topbar{
    padding:20px 30px 16px 30px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background: linear-gradient(180deg, rgba(10,20,52,0.6), rgba(10,20,52,0.2));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .topbar-left{ display:flex; align-items:center; gap:14px; min-width:0; }
  .mode-badge{
    width:46px; height:46px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
    background: var(--accent-light);
    border:1px solid var(--accent);
    color:#fff;
    box-shadow: 0 0 26px -6px var(--glow), inset 0 2px 6px rgba(255,255,255,0.3);
    transition: all 0.3s ease;
  }
  .topbar-title{
    font-family:'Sora', sans-serif; font-weight:700; font-size:20px;
    color:#fff; letter-spacing:-0.2px;
  }
  .topbar-sub{
    font-size:12.5px; color:var(--text-dim); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:56vw;
  }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  select, .btn-small{
    font-family:'Inter', sans-serif; font-weight:600; font-size:12px;
    padding:9px 12px; border-radius:11px;
    border:1px solid var(--line-strong);
    background: var(--glass);
    color: var(--text);
    cursor:pointer;
    transition: all 0.18s ease;
    box-shadow: var(--shadow-soft), inset 0 1px 2px rgba(255,255,255,0.12);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  select option{ background: var(--bg-2); color: var(--text); }
  select:hover, .btn-small:hover{
    border-color: var(--accent);
    color:#fff;
    box-shadow: 0 14px 30px -10px var(--glow), inset 0 1px 2px rgba(255,255,255,0.2);
  }
  select:active, .btn-small:active{ transform: translateY(2px); box-shadow: 0 4px 12px -6px var(--glow); }

  /* ===== Chat area ===== */
  .chat-scroll{
    flex:1; min-height:0; overflow-y:auto;
    padding: 30px 6% 20px 6%;
    scroll-behavior: smooth;
  }
  .chat-scroll::-webkit-scrollbar{ width:9px; }
  .chat-scroll::-webkit-scrollbar-track{ background:transparent; }
  .chat-scroll::-webkit-scrollbar-thumb{ background: rgba(120,170,255,0.18); border-radius:10px; }
  .chat-scroll::-webkit-scrollbar-thumb:hover{ background: var(--accent); }

  @keyframes riseIn{
    from{ opacity:0; transform: translateY(14px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes popIn{
    from{ opacity:0; transform: translateY(10px) scale(0.96); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .msg{
    max-width: 760px;
    margin: 0 auto 20px auto;
    display:flex; gap:12px; align-items:flex-end;
    animation: riseIn 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .msg.user{ flex-direction: row-reverse; }
  .avatar{
    width:36px; height:36px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow: var(--shadow-soft), inset 0 1px 2px rgba(255,255,255,0.25);
  }
  .msg.assistant .avatar{
    background: linear-gradient(145deg, #2E5FBF, #14307A);
    border:1px solid rgba(148,197,255,0.35);
  }
  .msg.user .avatar{
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    border:1px solid rgba(255,255,255,0.3);
    box-shadow: 0 10px 24px -8px var(--glow);
  }
  .bubble{
    position:relative;
    background: var(--glass);
    border:1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding:14px 17px;
    border-radius: var(--radius);
    font-size:14.5px; line-height:1.65;
    white-space:pre-wrap;
    color:var(--text);
    box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .msg.assistant .bubble{ border-bottom-left-radius:4px; border-left:3px solid var(--accent); }
  .msg.user .bubble{
    background: linear-gradient(150deg, var(--accent-light), rgba(255,255,255,0.05));
    border-color: var(--accent);
    border-bottom-right-radius:4px;
    box-shadow: 0 14px 34px -14px var(--glow), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .bubble strong{ color:#fff; font-weight:700; }
  .bubble code{
    font-family:'JetBrains Mono', monospace;
    background: rgba(4,12,36,0.7);
    border:1px solid var(--line);
    color:var(--sky);
    padding:2px 6px; border-radius:5px; font-size:13px;
  }

  /* ===== Empty state with 3D cube ===== */
  .empty-state{
    max-width:580px; margin:44px auto; text-align:center;
    animation: popIn 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .empty-glyph{
    width:150px; height:150px; margin:0 auto 22px auto;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .cube{ position:absolute; width:74px; height:74px; transform-style:preserve-3d; animation: cubeSpin 12s linear infinite; }
  .cube div{
    position:absolute; inset:0;
    border:1px solid rgba(120,180,255,0.45);
    background: rgba(37,99,235,0.12);
    box-shadow: inset 0 0 24px rgba(59,130,246,0.25);
  }
  .cube .f1{ transform: translateZ(37px); }
  .cube .f2{ transform: rotateY(90deg) translateZ(37px); }
  .cube .f3{ transform: rotateY(180deg) translateZ(37px); }
  .cube .f4{ transform: rotateY(-90deg) translateZ(37px); }
  .cube .f5{ transform: rotateX(90deg) translateZ(37px); }
  .cube .f6{ transform: rotateX(-90deg) translateZ(37px); }
  @keyframes cubeSpin{
    from{ transform: rotateX(-22deg) rotateY(0deg); }
    to{ transform: rotateX(-22deg) rotateY(360deg); }
  }
  .glyph-emoji{
    position:absolute; bottom:4px; font-size:34px;
    filter: drop-shadow(0 12px 22px var(--glow));
    animation: emojiBob 3.6s ease-in-out infinite;
  }
  @keyframes emojiBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .empty-state h2{
    font-family:'Sora', sans-serif; color:#fff; font-size:21px; margin-bottom:7px;
    letter-spacing:-0.2px;
  }
  .empty-state p{ font-size:13.5px; color:var(--text-dim); }
  .suggestions{
    display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:20px;
  }
  .chip{
    background: var(--glass);
    border:1px solid var(--line);
    padding:9px 15px; border-radius:22px;
    font-size:12.5px; font-weight:500;
    cursor:pointer; color:var(--text);
    box-shadow: var(--shadow-soft), inset 0 1px 1px rgba(255,255,255,0.08);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transition: all 0.18s ease;
  }
  .chip:hover{
    border-color: var(--accent); color:#fff; background: var(--accent-light);
    transform: translateY(-3px);
    box-shadow: 0 14px 30px -12px var(--glow), 0 0 0 1px var(--glow);
  }
  .chip:active{ transform: translateY(-1px) scale(0.98); }

  .typing{ display:flex; gap:4px; padding:6px 2px; }
  .typing span{
    width:7px; height:7px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--glow);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform: translateY(0); opacity:0.4;} 40%{ transform: translateY(-5px); opacity:1;} }

  .keybanner{
    max-width:760px; margin:0 auto 18px auto;
    background: rgba(202,138,4,0.12);
    border:1px solid rgba(250,204,21,0.3);
    border-radius:12px; padding:12px 16px;
    font-size:12.5px; color:#FDE68A;
    display:flex; gap:10px; align-items:flex-start; line-height:1.5;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow-soft);
  }
  .keybanner code{ background:rgba(4,12,36,0.7); padding:2px 6px; border-radius:5px; font-family:'JetBrains Mono',monospace; color:#FBBF24; border:1px solid rgba(250,204,21,0.2); }

  /* ===== Composer ===== */
  .composer{
    padding: 14px 6% 20px 6%;
    background: linear-gradient(180deg, transparent, rgba(6,12,36,0.7) 40%);
  }
  .composer-inner{
    max-width:760px; margin:0 auto;
    display:flex; align-items:flex-end; gap:10px;
    background: rgba(10,20,52,0.6);
    border:1.5px solid var(--line-strong);
    border-radius: 18px;
    padding: 9px 9px 9px 18px;
    box-shadow: var(--shadow-deep), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: all 0.22s ease;
  }
  .composer-inner:focus-within{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-light), 0 20px 50px -18px var(--glow);
    transform: translateY(-2px);
  }
  textarea{
    flex:1; border:none; outline:none; resize:none;
    font-family:'Inter', sans-serif; font-size:14.5px; line-height:1.5;
    max-height:140px; padding:9px 0; color:var(--text);
    background:transparent;
  }
  textarea::placeholder{ color:var(--text-faint); }
  .send-btn{
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    color:#fff; border:none;
    width:42px; height:42px; border-radius:13px;
    cursor:pointer; font-size:17px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.25),
      0 12px 26px -8px var(--glow),
      inset 0 2px 4px rgba(255,255,255,0.4),
      inset 0 -5px 10px rgba(6,20,60,0.5);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.12s ease, box-shadow 0.2s ease;
  }
  .send-btn:hover{ transform: translateY(-2px) scale(1.04); box-shadow: 0 18px 34px -10px var(--glow), inset 0 2px 4px rgba(255,255,255,0.5); }
  .send-btn:active{ transform: translateY(1px) scale(0.94); box-shadow: 0 5px 14px -6px var(--glow), inset 0 3px 8px rgba(6,20,60,0.5); }
  .send-btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .disclaimer{
    text-align:center; font-size:11px; color:var(--text-faint); margin-top:11px;
  }

  /* ===== Mobile responsive ===== */
  @media (max-width: 860px){
    body{ flex-direction:column; }

    .rail{
      width:100%; height:auto;
      flex-direction:row; align-items:center; justify-content:center;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      gap:6px;
      border-right:none; border-top:1px solid var(--line);
      background: rgba(6,12,36,0.85);
      position:fixed; bottom:0; left:0; right:0; z-index:20;
    }
    .brand, .rail-bottom{ display:none; }
    .tab{
      flex:1; flex-direction:row; gap:5px;
      padding:8px 4px; margin-bottom:0;
      font-size:10.5px; letter-spacing:0.3px;
      justify-content:center;
      border-radius:12px;
    }
    .tab .ticon{ width:32px; height:32px; font-size:14px; }
    .tab.active{ background: var(--accent-light); }

    .main{ padding-bottom: calc(90px + env(safe-area-inset-bottom)); }

    .topbar{ padding:14px 16px 12px 16px; }
    .topbar-sub{ display:none; }
    .mode-badge{ width:40px; height:40px; font-size:17px; border-radius:12px; }
    .topbar-title{ font-size:16px; }
    .chat-scroll{ padding: 20px 4% 16px 4%; }
    .composer{ padding: 10px 4% calc(10px + env(safe-area-inset-bottom)); }
    .msg{ max-width:100%; gap:9px; }
    .avatar{ width:30px; height:30px; font-size:14px; border-radius:10px; }
    .bubble{ padding:11px 13px; font-size:13.5px; }
    .empty-state{ margin:26px auto; }
    .empty-glyph{ width:120px; height:120px; }
    .cube{ width:58px; height:58px; }
    .cube .f1{ transform: translateZ(29px); }
    .cube .f2{ transform: rotateY(90deg) translateZ(29px); }
    .cube .f3{ transform: rotateY(180deg) translateZ(29px); }
    .cube .f4{ transform: rotateY(-90deg) translateZ(29px); }
    .cube .f5{ transform: rotateX(90deg) translateZ(29px); }
    .cube .f6{ transform: rotateX(-90deg) translateZ(29px); }
    .glyph-emoji{ font-size:26px; bottom:6px; }
  }

  @media (max-width: 480px){
    select{ display:none; }
    .topbar-title{ font-size:15px; }
    .tab .ticon{ width:30px; height:30px; font-size:14px; }
    .tab span:last-child{ font-size:9.5px; }
  }
</style>
</head>
<body>

  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div class="grid"></div>
  </div>

  <div class="rail">
    <div class="brand">म</div>
    <button class="tab active" data-mode="study"><span class="ticon">📘</span><span>Study</span></button>
    <button class="tab" data-mode="career"><span class="ticon">🧭</span><span>Career</span></button>
    <button class="tab" data-mode="interview"><span class="ticon">🎤</span><span>Interview</span></button>
    <button class="tab" data-mode="parent"><span class="ticon">👪</span><span>Parents</span></button>
    <div class="rail-bottom">MARGDARSHAK</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="mode-badge" id="modeBadge">📘</div>
        <div>
          <div class="topbar-title" id="modeTitle">Study Help</div>
          <div class="topbar-sub" id="modeSub">Ask about any concept, problem, or subject — I'll explain it step by step.</div>
        </div>
      </div>
      <div class="topbar-right">
        <select id="modelSelect">
          <option value="gemini-3.6-flash">Gemini 3.6 Flash (smartest)</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (fastest)</option>
        </select>
        <button class="btn-small" id="clearBtn">Clear chat</button>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="empty-glyph">
          <div class="cube">
            <div class="f1"></div><div class="f2"></div><div class="f3"></div>
            <div class="f4"></div><div class="f5"></div><div class="f6"></div>
          </div>
          <div class="glyph-emoji" id="emptyGlyph">📘</div>
        </div>
        <h2 id="emptyTitle">What are you working on?</h2>
        <p id="emptySub">Pick a suggestion below or type your own question.</p>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div id="messages"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Type your question..."></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
      <div class="disclaimer">Runs entirely in your browser using the free Gemini API · AI can make mistakes, verify important information.</div>
    </div>
  </div>

<script>
/* This frontend never sees your Gemini API key — it calls this app's own
   backend at /api/chat, and the backend (server.js) is the only place that
   holds the real key (in a .env file that's never sent to the browser). */
const CHAT_ENDPOINT = "/api/chat";

const MODES = {
  study: {
    title: "Study Help",
    sub: "Ask about any concept, problem, or subject — I'll explain it step by step.",
    icon: "📘",
    accent: "cyan",
    avatar: "📘",
    system: "You are Margdarshak, a patient and encouraging study tutor for college students. Explain concepts clearly with simple language and concrete examples. Break problems into steps and check the student's understanding before moving on — guide them to the answer rather than just handing it over, unless they explicitly ask for the direct solution. Use headings, bullet points, and code blocks where useful. Keep tone supportive, never condescending.",
    suggestions: ["Explain time complexity with an example", "Help me solve this calculus problem", "Quiz me on DBMS normalization", "Summarize the OSI model"]
  },
  career: {
    title: "Career Guidance",
    sub: "Explore career paths, skills to build, and how to plan your next steps.",
    icon: "🧭",
    accent: "sky",
    avatar: "🧭",
    system: "You are Margdarshak, an experienced and honest career counselor for college students and early professionals, especially in the Indian job market context. Help with career path exploration, skill-building roadmaps, higher-studies vs job decisions, resume direction, and industry realities. Ask clarifying questions about their branch, interests, and constraints when it helps you give better advice. Be practical and specific, not generic motivational talk.",
    suggestions: ["I'm a 2nd year CSE student, what should I focus on?", "Should I go for higher studies or a job?", "How do I switch from mechanical to data science?", "What skills matter most for product management?"]
  },
  interview: {
    title: "Interview Prep",
    sub: "Practice mock interviews and get direct, constructive feedback.",
    icon: "🎤",
    accent: "blue",
    avatar: "🎤",
    system: "You are Margdarshak, an interview coach. Conduct realistic mock interviews (HR, technical, or behavioral, based on what the student specifies). Ask ONE question at a time and wait for their answer before continuing. After each answer, give brief, direct feedback: what was strong, what to improve, and a short model answer if useful. Adapt difficulty and domain to the role the student mentions. If they haven't specified a role or interview type, ask first.",
    suggestions: ["Mock HR interview for a fresher", "Technical interview for a Java developer role", "Practice 'Tell me about yourself'", "Behavioral question on teamwork conflict"]
  },
  parent: {
    title: "Parent Counseling",
    sub: "Support for parents navigating their child's education and career choices.",
    icon: "👪",
    accent: "indigo",
    avatar: "👪",
    system: "You are Margdarshak, a warm and culturally sensitive counselor speaking with a parent about their child's education and career journey. Help parents understand modern career options and exam/stream systems, ease anxiety around results or comparisons with other children, and suggest ways to support their child's ambitions and wellbeing without adding excess pressure. Be respectful of family and cultural context, empathetic, and practical rather than clinical.",
    suggestions: ["My child wants to switch from engineering to arts", "How do I talk to my daughter about low exam marks?", "Is a government job still the safest choice?", "My son is stressed about placements, how can I help?"]
  }
};

const ACCENT_VARS = {
  cyan:    { light: 'rgba(34,211,238,0.16)',   main: '#22D3EE', deep: '#0E7490', glow: 'rgba(34,211,238,0.45)' },
  sky:     { light: 'rgba(56,189,248,0.16)',   main: '#38BDF8', deep: '#0369A1', glow: 'rgba(56,189,248,0.45)' },
  blue:    { light: 'rgba(59,130,246,0.16)',   main: '#3B82F6', deep: '#1D4ED8', glow: 'rgba(59,130,246,0.5)' },
  indigo:  { light: 'rgba(99,102,241,0.16)',   main: '#818CF8', deep: '#4338CA', glow: 'rgba(99,102,241,0.5)' }
};

let currentMode = "study";
let histories = { study: [], career: [], interview: [], parent: [] };
let isSending = false;

const chatScroll = document.getElementById('chatScroll');
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const emptyGlyph = document.getElementById('emptyGlyph');
const emptyTitle = document.getElementById('emptyTitle');
const emptySub = document.getElementById('emptySub');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const modeBadge = document.getElementById('modeBadge');
const modeTitle = document.getElementById('modeTitle');
const modeSub = document.getElementById('modeSub');
const suggestionsEl = document.getElementById('suggestions');
const modelSelect = document.getElementById('modelSelect');

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchMode(tab.dataset.mode));
});

function switchMode(mode){
  currentMode = mode;
  const m = MODES[mode];
  const acc = ACCENT_VARS[m.accent];
  document.documentElement.style.setProperty('--accent', acc.main);
  document.documentElement.style.setProperty('--accent-light', acc.light);
  document.documentElement.style.setProperty('--accent-deep', acc.deep);
  document.documentElement.style.setProperty('--glow', acc.glow);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  modeBadge.textContent = m.icon;
  modeBadge.style.background = acc.light;
  modeTitle.textContent = m.title;
  modeSub.textContent = m.sub;
  emptyGlyph.textContent = m.icon;
  emptyTitle.textContent = mode === 'study' ? "What are you working on?" :
    mode === 'career' ? "Where do you want your career to go?" :
    mode === 'interview' ? "Ready to practice?" :
    "How can I help you support your child?";
  renderSuggestions();
  renderMessages();
}

function renderSuggestions(){
  suggestionsEl.innerHTML = '';
  MODES[currentMode].suggestions.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = s;
    chip.onclick = () => { input.value = s; input.focus(); autoGrow(); };
    suggestionsEl.appendChild(chip);
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatContent(text){
  let safe = escapeHtml(text);
  safe = safe.replace(/```([\s\S]*?)```/g, (m, code) => `<code style="display:block;white-space:pre-wrap;padding:8px;">${code}</code>`);
  safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return safe;
}

function renderMessages(){
  const hist = histories[currentMode];
  messagesEl.innerHTML = '';
  emptyState.style.display = hist.length === 0 ? 'block' : 'none';

  hist.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = m.role === 'user' ? '🙂' : MODES[currentMode].avatar;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatContent(m.content);
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  });
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function autoGrow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
sendBtn.addEventListener('click', handleSend);

async function handleSend(){
  const text = input.value.trim();
  if (!text || isSending) return;

  histories[currentMode].push({ role:'user', content:text });
  input.value = '';
  autoGrow();
  renderMessages();
  showTyping();
  isSending = true;
  sendBtn.disabled = true;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 80000);

  try{
    const contents = histories[currentMode].map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.content }]
    }));

    const res = await fetch(CHAT_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      signal: controller.signal,
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: MODES[currentMode].system }] },
        model: modelSelect.value
      })
    });

    hideTyping();

    if (!res.ok){
      const errBody = await res.json().catch(() => ({}));
      const msg = errBody?.error?.message || `Request failed (status ${res.status})`;
      histories[currentMode].push({ role:'assistant', content: `⚠️ ${msg}\n\nIf this mentions a missing API key: go to your Vercel project → Settings → Environment Variables, confirm GEMINI_API_KEY is set correctly, then go to Deployments and Redeploy (env var changes need a redeploy to take effect).` });
      renderMessages();
      return;
    }

    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || "Sorry, I couldn't generate a response. The reply may have been blocked by a safety filter — try rephrasing.";
    histories[currentMode].push({ role:'assistant', content: reply });
    renderMessages();
  } catch(err){
    hideTyping();
    const isTimeout = err.name === 'AbortError';
    histories[currentMode].push({ role:'assistant', content: isTimeout
      ? '⚠️ The AI took too long to respond. Please try again — if this keeps happening you may have hit your free Gemini rate limit.'
      : `⚠️ Network error: ${err.message}. Check your internet connection and try again.` });
    renderMessages();
  } finally {
    clearTimeout(timer);
    isSending = false;
    sendBtn.disabled = false;
  }
}

function showTyping(){
  emptyState.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg assistant';
  row.id = 'typingRow';
  row.innerHTML = `<div class="avatar">${MODES[currentMode].avatar}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}
function hideTyping(){
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

document.getElementById('clearBtn').addEventListener('click', () => {
  histories[currentMode] = [];
  renderMessages();
});

// Init
switchMode('study');
</script>
</body>
</html>
